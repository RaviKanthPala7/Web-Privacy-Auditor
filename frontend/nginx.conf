server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA — send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Local docker compose only (when VITE_API_URL is empty in the build).
    # On GCP the UI calls the API URL directly in the browser.
    location /audit {
        proxy_pass http://api:8000/audit;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
