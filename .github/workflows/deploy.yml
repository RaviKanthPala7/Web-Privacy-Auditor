# Deploy API + web to Cloud Run when code is merged/pushed to main.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PROJECT_ID: web-privacy-auditor
  REGION: asia-south1
  AR_REPO: web-privacy-auditor
  API_SERVICE: privacy-api
  WEB_SERVICE: privacy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@web-privacy-auditor.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api"
          # --async avoids log-stream permission errors on the GitHub deploy SA
          BUILD_ID=$(gcloud builds submit ./backend \
            --async \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            --format='value(id)')
          echo "Cloud Build ID: ${BUILD_ID}"
          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format='value(status)')
            echo "API image build status: ${STATUS}"
            [ "${STATUS}" = "SUCCESS" ] && exit 0
            case "${STATUS}" in FAILURE|CANCELLED|EXPIRED|TIMEOUT) exit 1 ;; esac
            sleep 20
          done
          echo "Timed out waiting for API image build"
          exit 1

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --timeout 300 \
            --port 8000

      - name: Resolve API URL
        id: api
        run: |
          URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        working-directory: frontend
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/web:latest"
          BUILD_ID=$(gcloud builds submit --config=cloudbuild.yaml \
            --async \
            --substitutions=_VITE_API_URL=${{ steps.api.outputs.url }},_IMAGE_TAG="${IMAGE}" \
            --format='value(id)')
          echo "Cloud Build ID: ${BUILD_ID}"
          for i in $(seq 1 30); do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format='value(status)')
            echo "Web image build status: ${STATUS}"
            [ "${STATUS}" = "SUCCESS" ] && exit 0
            case "${STATUS}" in FAILURE|CANCELLED|EXPIRED|TIMEOUT) exit 1 ;; esac
            sleep 15
          done
          echo "Timed out waiting for web image build"
          exit 1

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/web:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080

      # Bad/empty CORS_ORIGINS on Cloud Run overrides main.py defaults — remove it.
      # Production web URL is already in backend/app/main.py _default_cors.
      - name: Reset API CORS env (use code defaults)
        run: |
          gcloud run services update ${{ env.API_SERVICE }} \
            --region ${{ env.REGION }} \
            --remove-env-vars=CORS_ORIGINS

      - name: Verify browser can call API (CORS)
        run: |
          WEB_URL=$(gcloud run services describe ${{ env.WEB_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "Origin: ${WEB_URL}"
          echo "API: ${API_URL}/health"
          HEADERS=$(curl -sS -D - -o /dev/null -H "Origin: ${WEB_URL}" "${API_URL}/health")
          echo "${HEADERS}"
          echo "${HEADERS}" | grep -qi "access-control-allow-origin" || {
            echo "::error::CORS check failed — deploy blocked"
            exit 1
          }

      - name: Deployment summary
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $(gcloud run services describe ${{ env.API_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $(gcloud run services describe ${{ env.WEB_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
